<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ELYZA · studio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Gaegu:wght@700&family=Karla:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="studio">

<main class="studio-wrap">
  <a class="brand" href="/">ELYZA<span>♡</span></a>

  <!-- login -->
  <form class="panel" id="login" hidden>
    <p class="kicker">studio</p>
    <h1>Hi Elyza</h1>
    <p class="note">Log in to add posts to your portfolio.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">Log in</button>
    <p class="error" id="loginError" role="alert"></p>
  </form>

  <!-- manager -->
  <section id="manager" hidden>
    <form class="panel" id="add">
      <p class="kicker">studio</p>
      <h1>Add a post</h1>
      <p class="note">Paste a link from Instagram, TikTok, Facebook or YouTube (Share → Copy link), or upload a photo or short clip.</p>
      <label for="url">Post link</label>
      <input id="url" type="url" inputmode="url" placeholder="https://www.instagram.com/reel/…">
      <p class="or">or</p>
      <label for="file">Upload a photo or short clip <span class="opt">photos up to 15 MB, clips up to 60 MB</span></label>
      <input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/quicktime,video/webm">
      <progress id="progress" max="100" value="0" hidden></progress>
      <div class="two">
        <div>
          <label for="category">World</label>
          <select id="category">
            <option value="glam">Glam (makeup)</option>
            <option value="play">Play (gaming)</option>
            <option value="peaks">Peaks (hiking)</option>
            <option value="shred">Shred (snowboarding)</option>
            <option value="life">Life (everything else)</option>
          </select>
        </div>
        <div>
          <label for="caption">Caption <span class="opt">optional</span></label>
          <input id="caption" type="text" maxlength="140" placeholder="soft glam for a powder day">
        </div>
      </div>
      <button class="btn" type="submit" id="addBtn">Add to portfolio</button>
      <p class="error" id="addError" role="alert"></p>
    </form>

    <div class="list-head">
      <h2>Your portfolio <span id="count"></span></h2>
      <div>
        <a class="btn ghost" href="/works" target="_blank" rel="noopener">View my works</a>
        <button class="btn ghost" id="logout" type="button">Log out</button>
      </div>
    </div>
    <p class="note" id="empty" hidden>Nothing here yet. Paste your first link above.</p>
    <ol class="posts" id="posts"></ol>
  </section>
</main>

<div class="toast" id="toast" role="status"></div>
<script src="/admin/blob-upload.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
